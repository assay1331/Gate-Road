<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#202124">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Road</title>
<style>
html,body{margin:0;height:100%;background:#202124;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
canvas{display:block}
</style>
</head>
<body>
<canvas id="cv" width="720" height="1280"></canvas>
<script>
const c=document.getElementById('cv'),g=c.getContext('2d');
const W=360,H=640,PY=400,RL=40,RR=320,GAP=320,BG='#202124',INK='#d0d0d0';
const FONT=s=>'bold '+s+'px "Courier New",monospace';
let L=1,n=10,e=0,dist=0,px=180,rows=[],eZ=0,state='menu',last=0,lock=0,dn=10,fx=[],pulse=0,best=0,newBest=false,winT=0,cf=[],toast=0,toastMsg='',ak=0,readyT=0,runT=0,fN=0,fE=0,acc=0,fr=1;
try{best=+localStorage.getItem('gr_best')||0}catch(er){}

function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(window.devicePixelRatio||1,3);
 c.style.width=W*s+'px';c.style.height=H*s+'px';c.width=Math.round(W*s*d);c.height=Math.round(H*s*d);g.setTransform(c.width/W,0,0,c.height/H,0,0)}
fit();addEventListener('resize',fit);

const ap=(q,v)=>q.t=='+'?v+q.v:q.t=='x'?v*q.v:q.t=='/'?Math.max(1,Math.floor(v/q.v)):Math.max(1,v-q.v);
function gen(){const r=Math.random();
 if(r<.4)return{t:'+',v:Math.round((5+Math.random()*15)*(1+L*.3))};
 if(r<.65)return{t:'x',v:Math.random()<.2?3:2};
 if(r<.85)return{t:'+',v:Math.round(2+Math.random()*5)};
 return{t:'-',v:Math.round(5+Math.random()*10)}}
function genRow(b){const R=Math.random,P=v=>({t:'+',v:Math.max(2,Math.round(v))}),X=v=>({t:'x',v}),M=v=>({t:'-',v:Math.max(2,Math.round(v))}),D=v=>({t:'/',v}),r=R();let a,c;
 if(r<.30){a=X(2);c=P(b*(.7+R()*.6))}
 else if(r<.48){a=P(b*(.3+R()*.3));c=P(b*(.15+R()*.3))}
 else if(r<.62){a=X(R()<.3?3:2);c=M(b*(.2+R()*.3))}
 else if(r<.76){a=P(b*(.35+R()*.3));c=D(2)}
 else if(r<.88&&L>=2){a=D(2);c=M(b*(.3+R()*.35))}
 else{a=X(3);c=P(b*(1.5+R()))}
 return R()<.5?[a,c]:[c,a]}
function start(){n=10;dn=10;fx=[];pulse=0;dist=0;px=180;dragPx=180;rows=[];let b=n;
 const N=Math.min(9+L,16);for(let i=0;i<N;i++){const [l,r]=genRow(b);rows.push({z:GAP*(i+1),l,r,done:false});b=Math.max(ap(l,b),ap(r,b))}
 eZ=GAP*(N+1);e=Math.max(5,Math.round(b*(.72+Math.min(.21,.03*L))));state='ready';readyT=0;runT=0;fN=0;fE=0}
function setX(ev){const r=c.getBoundingClientRect();px=Math.max(RL+20,Math.min(RR-20,(ev.clientX-r.left)/r.width*W))}
let dragX=null,dragPx=180;
async function share(){const tx='Gate Road: I cleared stage '+L+' with '+n+' soldiers left! Can you beat it?';
 try{if(navigator.share){await navigator.share({title:'Gate Road',text:tx,url:location.href});return}}catch(er){if(er&&er.name=='AbortError')return}
 try{await navigator.clipboard.writeText(tx+' '+location.href);toastMsg='Link copied!'}catch(er){toastMsg='Sharing is not supported here'}
 toast=performance.now()+2200}
function press(ev){dragX=ev.clientX;dragPx=px;
 if(state!='run'&&state!='fight'&&performance.now()>lock){
  if(state=='win'&&ev.clientY!=null){const r=c.getBoundingClientRect(),yy=(ev.clientY-r.top)/r.height*H;if(yy>480&&yy<535){share();return}}
  if(state=='win')L++;
  if(state=='menu'||state=='over'||state=='win')start()}}
c.addEventListener('pointerdown',press);
c.addEventListener('pointermove',ev=>{if(dragX!=null&&(state=='run'||state=='fight'||state=='ready')){const k=W/c.getBoundingClientRect().width;px=Math.max(RL+20,Math.min(RR-20,dragPx+(ev.clientX-dragX)*k))}});
addEventListener('pointerup',()=>{dragX=null});addEventListener('pointercancel',()=>{dragX=null});
addEventListener('keydown',ev=>{
 if(ev.key=='ArrowLeft')px=Math.max(RL+20,px-30);
 if(ev.key=='ArrowRight')px=Math.min(RR-20,px+30);
 if(ev.key==' '||ev.key=='Enter')press({clientX:c.getBoundingClientRect().left+px/W*c.getBoundingClientRect().width})});

function burst(o,m){const d=m-o,up=d>=0,k=Math.min(Math.abs(d),18);pulse=up?1:-1;
 fx.push({s:(up?'+':'-')+Math.abs(d),x:px,y:PY-70,vx:0,vy:-40,life:1.2});
 for(let i=0;i<k;i++){const a=Math.random()*6.28,v=40+Math.random()*60;
  fx.push({x:px,y:PY-10,vx:Math.cos(a)*v,vy:up?-Math.abs(Math.sin(a))*v-20:Math.abs(Math.sin(a))*v,h:!up,life:.8+Math.random()*.4})}}
function drawFx(){for(const f of fx){g.globalAlpha=Math.max(0,Math.min(1,f.life));g.fillStyle=INK;g.strokeStyle=INK;g.lineWidth=1.5;
  if(f.s){g.font=FONT(26);g.textAlign='center';g.fillText(f.s,f.x,f.y)}
  else f.h?g.strokeRect(f.x,f.y,4,4):g.fillRect(f.x,f.y,4,4)}
 g.globalAlpha=1}
function man(X,Y,i,h){const ph=(Math.floor(ak*8)+i)%2;Y+=ph?0:-1;g.fillStyle=INK;g.strokeStyle=INK;g.lineWidth=1;
 if(h){g.strokeRect(X+1.5,Y+.5,2,2);g.strokeRect(X+.5,Y+3.5,4,3);g.fillRect(X+(ph?0:3),Y+7,2,2);g.fillRect(X+(ph?3:0),Y+7,2,3);g.fillRect(X+5,Y+3,1,7)}
 else{g.fillRect(X+1,Y,3,3);g.fillRect(X,Y+3,5,4);g.fillRect(X+(ph?0:3),Y+7,2,3);g.fillRect(X+(ph?3:0),Y+7,2,2);g.fillRect(X+5,Y-2,1,7)}}
function crowd(cx,cy,k,hollow,vis){const m=vis!=null?vis:Math.min(k,120);g.fillStyle=INK;g.strokeStyle=INK;g.lineWidth=1.5;
 for(let i=0;i<m;i++){const a=i*2.4,r=6*Math.sqrt(i)*(hollow?1:1+pulse*.35);
  const X=Math.round((cx+Math.cos(a)*r)/7)*7,Y=Math.round((cy+Math.sin(a)*r*.85)/10)*10;
  man(X,Y,i,hollow)}
 g.font=FONT(20);g.textAlign='center';g.fillStyle=INK;g.fillText(k,cx,cy-6*Math.sqrt(m)*.85-16)}
function gateOld(x0,y,q){const w=132,h=40,X=x0+4,Y=y-20;g.lineWidth=3;g.strokeStyle=INK;g.fillStyle=INK;
 if(q.t=='x'){g.fillRect(X,Y,w,h);g.fillStyle=BG}
 else{g.setLineDash(q.t=='-'?[6,5]:[]);g.strokeRect(X+1.5,Y+1.5,w-3,h-3);g.setLineDash([])}
 g.font=FONT(26);g.textAlign='center';g.fillText((q.t=='x'?'×':q.t=='+'?'+':'-')+q.v,X+w/2,y+9)}
function txt(s,y,sz,a){g.fillStyle=INK;g.font=FONT(sz);g.textAlign='center';g.globalAlpha=a==null?1:a;g.fillText(s,W/2,y);g.globalAlpha=1}

function drawReady(){const t=readyT;
 g.fillStyle=BG;g.globalAlpha=Math.max(0,1-t/.35);g.fillRect(0,0,W,H);g.globalAlpha=1;
 if(t<.9){const s=t<.2?.6+t/.2*.5:t<.3?1.1-(t-.2)/.1*.1:1;
  g.fillStyle=BG;g.globalAlpha=.9;g.fillRect(40,200,280,150);g.globalAlpha=1;
  g.strokeStyle=INK;g.lineWidth=4;g.strokeRect(42,202,276,146);
  txt('STAGE',240,20);
  g.save();g.translate(W/2,322);g.scale(s,s);g.fillStyle=INK;g.font=FONT(72);g.textAlign='center';g.fillText(L,0,0);g.restore();
  if(L==1)txt('Drag left and right',385,14)}
 else{const s=1+(t-.9)*.6;g.save();g.translate(W/2,300);g.scale(s,s);g.globalAlpha=Math.max(0,1-(t-.9)/.5);g.fillStyle=INK;g.font=FONT(48);g.textAlign='center';g.fillText('GO!',0,0);g.restore();g.globalAlpha=1}}
const vis=(k,f)=>k<=0?0:Math.max(1,Math.ceil(Math.min(f,120)*k/f));
const rnd=k=>{const s=Math.sin(k*12.9898)*43758.5453;return s-Math.floor(s)};
function cactus(x,y){g.fillRect(x+3,y,3,14);g.fillRect(x,y+5,3,2);g.fillRect(x,y+3,2,4);g.fillRect(x+6,y+7,3,2);g.fillRect(x+7,y+4,2,4)}
function drawRoad(){
 g.fillStyle=INK;
 const z0=Math.floor((dist+PY-H)/24)-1,z1=Math.ceil((dist+PY)/24)+1;
 for(let z=z0;z<=z1;z++){const y=PY-(z*24-dist),a=rnd(z),b=rnd(z+999),q=rnd(z+555);
  if(a<.5)g.fillRect(RL+14+Math.floor(b*(RR-RL-28)),y,2,2);
  if(q<.3)g.fillRect(RL+14+Math.floor(a*(RR-RL-40)),y+10,6,2);
  if(b>.8)cactus(a<.5?4+Math.floor(q*12):340+Math.floor(q*12),y);
  else if(q>.6)g.fillRect(a<.5?6+Math.floor(b*14):340+Math.floor(b*14),y+8,3,2)}
 g.globalAlpha=.3;for(let y=-36+(dist%36);y<H;y+=36)g.fillRect(179,y,2,18);g.globalAlpha=1;
 const fy=PY-(eZ-40-dist);
 if(fy>-20&&fy<H+10)for(let i=0;i<(RR-RL)/10;i++)g.fillRect(RL+i*10,fy+((i&1)?0:10),10,10);
 const off=dist%16,fl=Math.floor(dist/16);
 for(const wx of [RL-14,RR]){g.fillStyle=INK;g.fillRect(wx,0,14,H);g.fillStyle=BG;
  for(let r=0,y=-16+off;y<H;r++,y+=16){const idx=fl-r;g.fillRect(wx,y,14,1);g.fillRect(wx+((Math.abs(idx)&1)?4:10),y,1,16)}}}
function pbox(X,Y,w,h,col){g.fillStyle=col;g.fillRect(X+3,Y,w-6,h);g.fillRect(X,Y+3,w,h-6);g.fillRect(X+1,Y+1,w-2,h-2)}
function gate(x0,y,q){const w=132,h=44,X=x0+4,Y=y-22,bx=X+6,bw=w-12,m=q.t=='-'?'-':q.t=='x'?'×':q.t=='/'?'÷':'+';
 g.fillStyle=INK;g.fillRect(X,Y-6,6,h+12);g.fillRect(X+w-6,Y-6,6,h+12);g.fillRect(X-2,Y-8,10,3);g.fillRect(X+w-8,Y-8,10,3);
 for(let d=10;d<w-10;d+=6)g.fillRect(X+d,Y+h+8,3,2);
 pbox(bx,Y,bw,h,INK);
 if(q.t=='+')pbox(bx+3,Y+3,bw-6,h-6,BG);
 else if(q.t=='x'){g.fillStyle=BG;for(let d=6;d<bw-6;d+=6){g.fillRect(bx+d,Y+5,3,2);g.fillRect(bx+d,Y+h-7,3,2)}for(let d=7;d<h-7;d+=6){g.fillRect(bx+5,Y+d,2,3);g.fillRect(bx+bw-7,Y+d,2,3)}}
 else{const sd=q.t=='/',ln=sd?BG:INK;pbox(bx+3,Y+3,bw-6,h-6,sd?INK:BG);
  g.save();g.beginPath();g.rect(bx+3,Y+3,bw-6,h-6);g.rect(bx+9,Y+9,bw-18,h-18);g.clip('evenodd');g.strokeStyle=ln;g.lineWidth=2;
  for(let d=-h;d<bw;d+=8){g.beginPath();g.moveTo(bx+d,Y+h);g.lineTo(bx+d+h,Y);g.stroke()}g.restore()}
 g.fillStyle=(q.t=='x'||q.t=='/')?BG:INK;g.font=FONT(30);g.textAlign='center';g.fillText(m+q.v,X+w/2,y+10)}
const conf=init=>({x:Math.random()*W,y:init?-Math.random()*300:-10,vx:(Math.random()-.5)*30,vy:60+Math.random()*80,h:Math.random()<.5});
function drawWin(t){
 g.lineWidth=1.5;for(const q of cf){g.fillStyle=INK;g.strokeStyle=INK;q.h?g.strokeRect(q.x,q.y,5,5):g.fillRect(q.x,q.y,5,5)}
 g.fillStyle=BG;g.fillRect(30,130,300,330);g.strokeStyle=INK;g.lineWidth=4;g.strokeRect(32,132,296,326);
 txt('Victory!',172,22);
 const s=winT<.25?winT/.25*1.3:winT<.4?1.3-(winT-.25)/.15*.3:1;
 g.save();g.translate(W/2,290);g.scale(s,s);g.fillStyle=INK;g.font=FONT(110);g.textAlign='center';g.fillText(L,0,0);g.restore();
 txt('STAGE CLEAR!',332,30);
 txt(L==1?'Your first win!':L<5?'Nice run!':L<10?'Great job, champion!':'Legendary commander!',366,15);
 txt('Soldiers left: '+n,396,15);
 txt(newBest?'★ NEW BEST! ★':'Best: stage '+best,430,15,newBest?(Math.floor(t/300)%2?1:.4):1);
 g.strokeStyle=INK;g.lineWidth=3;g.strokeRect(50,486,260,44);txt('Share my record',514,18);
 g.fillStyle=INK;g.fillRect(50,544,260,48);g.fillStyle=BG;g.font=FONT(20);g.textAlign='center';g.fillText('Next stage >',W/2,575);
 if(toast>performance.now())txt(toastMsg,478,13)}
function draw(t){
 g.fillStyle=BG;g.fillRect(0,0,W,H);
 drawRoad();
 
 for(const r of rows){const y=PY-(r.z-dist);if(y>-40&&y<H+40&&!r.done){gate(RL,y,r.l);gate(180,y,r.r)}}
 if(e>0){const ey=PY-(eZ-dist);if(ey>-120)crowd(180,ey,e,true,fN>0?vis(e,fE):undefined)}
 if(state!='menu'){crowd(px,PY,Math.max(Math.round(dn),0),false,fN>0?vis(n,fN):undefined);drawFx()}
 if(state=='menu'){crowd(180,420,10,false);txt('Gate Road',220,34);txt('Drag to pick the better gate',262,14);
  txt('Beat the enemy army at the end',284,14);txt('Tap to start',560,18,Math.floor(t/500)%2?1:.25)}
 else{g.fillStyle=INK;g.font=FONT(16);g.textAlign='right';g.fillText('Stage '+String(L).padStart(2,'0'),W-12,26);const pr=Math.min(1,dist/(eZ-70));g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(13,14,120,10);g.fillRect(16,17,114*pr,4)}
 if(state=='over'){txt('G A M E  O V E R',250,26);txt('The enemy had more soldiers',282,14);txt('Tap to try again',560,18,Math.floor(t/500)%2?1:.25)}
 if(state=='win')drawWin(t);if(state=='ready')drawReady();
}
function tick(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(state=='ready'){readyT+=dt;if(readyT>=1.4){state='run';runT=0}}
 else if(state=='run'){runT+=dt;dist+=Math.min(105+16*(L-1),300)*dt*Math.min(1,.25+runT/.8);
  for(const r of rows)if(!r.done&&r.z-dist<=0){r.done=true;const q=px<180?r.l:r.r,o=n;n=ap(q,n);burst(o,n)}
  if(eZ-dist<=70){state='fight';fN=Math.max(n,1);fE=e;acc=0;fr=Math.max(20,Math.min(n,e)/2.2)}}
 else if(state=='fight'){acc+=fr*dt;const s=Math.floor(acc);acc-=s;n-=s;e-=s;dn=n;
  if(Math.random()<.6)fx.push({x:px+(Math.random()-.5)*90,y:PY-35+(Math.random()-.5)*12,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,h:Math.random()<.5,life:.5});
  if(e<=0||n<=0){n=Math.max(n,0);e=Math.max(e,0);state=(e<=0&&n>0)?'win':'over';lock=performance.now()+600;if(state=='win'){winT=0;cf=[];newBest=L>best;if(newBest){best=L;try{localStorage.setItem('gr_best',best)}catch(er){}}for(let i=0;i<50;i++)cf.push(conf(true))}}}
 for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt*1.2}fx=fx.filter(f=>f.life>0);
 if(state=='run'||state=='fight'||(state=='ready'&&readyT>.9))ak+=dt;if(state=='win'){winT+=dt;for(const q of cf){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.y>H)Object.assign(q,conf(false))}}
 dn+=(n-dn)*Math.min(1,dt*8);pulse*=Math.max(0,1-dt*5);
 draw(t);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
</body>
</html>
